<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2f66"/>
      <stop offset="1" stop-color="#0a1128"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd877"/>
      <stop offset="1" stop-color="#e0a92e"/>
    </linearGradient>
    <mask id="moon">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="840" cy="170" r="92" fill="#000"/>
    </mask>
  </defs>

  <!-- Gece göğü -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <g fill="#f2f5ff" opacity=".85">
    <circle cx="150" cy="140" r="6"/><circle cx="300" cy="90" r="4"/><circle cx="470" cy="170" r="5"/>
    <circle cx="610" cy="80" r="4"/><circle cx="110" cy="330" r="4"/><circle cx="920" cy="380" r="5"/>
    <circle cx="660" cy="260" r="3"/>
  </g>
  <!-- Hilal -->
  <circle cx="790" cy="210" r="110" fill="url(#gold)" mask="url(#moon)"/>

  <!-- İstanbul silueti -->
  <g fill="#070c1d">
    <rect x="0" y="860" width="1024" height="164"/>
    <path d="M60 860 v-70 a70 70 0 0 1 140 0 v70z"/>
    <rect x="215" y="660" width="18" height="200"/><path d="M212 660 l12 -48 l12 48z"/>
    <path d="M250 860 v-110 a130 130 0 0 1 260 0 v110z"/>
    <rect x="370" y="610" width="20" height="80"/><circle cx="380" cy="600" r="12"/>
    <rect x="528" y="640" width="18" height="220"/><path d="M525 640 l12 -50 l12 50z"/>
    <path d="M570 860 v-60 a60 60 0 0 1 120 0 v60z"/>
    <rect x="700" y="760" width="120" height="100"/><path d="M700 760 l60 -40 l60 40z"/>
    <path d="M840 860 v-80 a80 80 0 0 1 160 0 v80z"/>
    <rect x="985" y="690" width="16" height="170"/><path d="M982 690 l11 -44 l11 44z"/>
  </g>

  <!-- Centilmen hırsız: fötr şapka ve göz maskesi -->
  <g fill="url(#gold)">
    <!-- şapka tepesi -->
    <path d="M352 450 C 352 330, 400 292, 512 292 C 624 292, 672 330, 672 450 Z"/>
    <!-- şapka siperi -->
    <path d="M232 470 C 232 430, 340 424, 512 424 C 684 424, 792 430, 792 470 C 792 500, 690 504, 512 504 C 334 504, 232 500, 232 470 Z"/>
    <!-- maske -->
    <path d="M300 566 C 300 534, 360 520, 430 524 C 470 527, 494 540, 512 556 C 530 540, 554 527, 594 524 C 664 520, 724 534, 724 566 C 724 628, 676 664, 610 664 C 562 664, 534 640, 512 616 C 490 640, 462 664, 414 664 C 348 664, 300 628, 300 566 Z"/>
  </g>
  <!-- şapka bandı ve göz delikleri -->
  <path d="M356 404 C 400 396, 624 396, 668 404 L 670 432 C 620 426, 404 426, 354 432 Z" fill="#0a1128" opacity=".75"/>
  <ellipse cx="420" cy="590" rx="58" ry="30" fill="#0a1128"/>
  <ellipse cx="604" cy="590" rx="58" ry="30" fill="#0a1128"/>
</svg>
